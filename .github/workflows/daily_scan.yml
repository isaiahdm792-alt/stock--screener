name: Daily Stock Scan

on:
  schedule:
    # Runs at 8:00 PM UTC every day - adjust the hour to match when you want it to run
    - cron: '0 20 * * *'
  workflow_dispatch:  # lets you also trigger it manually from the GitHub Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests transformers torch lxml

      - name: Run daily scan
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python daily_scan.py

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scored_snapshot.csv fundamentals_snapshot.csv technicals_snapshot.csv sentiment_snapshot.csv insider_snapshot.csv macro_snapshot.csv score_history.csv
          git diff --quiet --cached || git commit -m "Automated daily scan update"
          git push
